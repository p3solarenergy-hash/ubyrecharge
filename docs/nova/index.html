<!doctype html>
<html lang="pt-BR">
<head>
<script src="app/storage-ns.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c30">
  <title>UBY Recharge — Plataforma</title>
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="app/app.css?v=1">
  <script>
    // Sem sessao, vai direto para o login novo.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("uby-auth-session-v1") || "null");
        var valid = s && s.email && s.loginAt && (Date.now() - new Date(s.loginAt).getTime()) < 12 * 3600 * 1000;
        if (!valid) location.replace("login.html");
      } catch (e) { location.replace("login.html"); }
    })();
    // Tema escolhido (claro ou night) antes de pintar a tela.
    try { if (localStorage.getItem("uby-theme-v1") === "night") document.documentElement.dataset.theme = "night"; } catch (e) {}
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="assets/brand.svg" alt="UBY Recharge"><span class="chip">LOCAL</span></div>
      <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
      <div class="sidebar-foot">
        <div class="who"><span class="avatar" id="userAvatar">U</span><div><strong id="userName">—</strong><small id="userRole">—</small></div></div>
        <button class="btn ghost" id="logoutButton" type="button">Sair</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="btn menu-button" id="menuButton" aria-label="Abrir menu">☰</button>
        <div class="crumb"><span id="crumbGroup">UBY Recharge</span><strong id="crumbTitle">Carregando…</strong></div>
        <div class="top-actions">
          <label id="periodWrap" hidden><select class="select" id="periodSelect" aria-label="Período" autocomplete="off"></select></label>
          <a class="btn primary hide-sm link-btn" href="#/lancamentos">＋ Lançar</a>
          <span class="pill ro hide-sm" title="Nenhuma gravação é enviada ao Supabase a partir desta versão local."><i class="dot"></i>Somente leitura</span>
          <span class="pill warn hide-sm" id="dataStatus"><i class="dot"></i><span>Conectando…</span></span>
          <button class="btn" id="refreshButton" type="button" title="Recarregar dados do Supabase">↻</button>
        </div>
      </header>

      <section class="content" id="view" aria-live="polite"></section>

      <section class="classic-wrap" id="classicWrap">
        <div class="classic-bar"><span>Tela original · <strong id="classicTitle"></strong> · todas as funções e cálculos da plataforma, com as cores da nova. Gravações bloqueadas nesta versão local.</span><a href="#" id="classicOpen" target="_blank" rel="noopener">Abrir em nova aba ↗</a></div>
        <iframe id="classicFrame" title="Visão clássica"></iframe>
      </section>
    </main>
  </div>

  <!-- Motor original de cálculo (recargas_app.js) em segundo plano. -->
  <iframe id="motorFrame" title="Motor de cálculo" aria-hidden="true" tabindex="-1"></iframe>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app/shell.js?v=2"></script>
  <script src="app/views/resumo.js?v=1"></script>
  <script src="app/views/modelo.js?v=1"></script>
  <script src="app/views/comando.js?v=1"></script>
  <script src="app/views/unidades.js?v=1"></script>
  <script src="app/views/financeiro.js?v=2"></script>
  <script src="app/views/clientes.js?v=1"></script>
  <script src="app/views/clube.js?v=1"></script>
  <script src="app/views/lancamentos.js?v=1"></script>
  <script src="app/views/obras.js?v=1"></script>
  <script src="app/views/uso.js?v=1"></script>
  <script src="app/views/configuracao.js?v=1"></script>
  <script src="app/views/tarefas.js?v=1"></script>
  <script src="app/views/mapa.js?v=1"></script>
  <script src="app/views/importar.js?v=1"></script>
  <script src="app/views/analisadores.js?v=1"></script>
  <script src="app/views/mercado.js?v=1"></script>
  <script src="app/views/auditoria.js?v=1"></script>
  <script src="app/views/parametros.js?v=4"></script>
  <script src="app/reports.js?v=1"></script>
  <script>UBY.start();</script>
</body>
</html>
